name: Deploy Editor (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # kof CLI da distro oficial
      - name: Install kof
        run: |
          curl -L https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-linux-x86_64/kof-0.2.5-beta-linux-x86_64.tar.gz -o kof.tar.gz
          KOFDIR=$(tar tzf kof.tar.gz | head -1 | cut -d/ -f1)
          tar xzf kof.tar.gz
          "$KOFDIR/bin/kof" version >> "$GITHUB_STEP_SUMMARY" || true
          echo "$PWD/$KOFDIR/bin" >> "$GITHUB_PATH"

      - name: Build (combine)
        run: bash scripts/web-combine.sh

      - name: Check
        run: kof check build/editor-web.kf

      # snapshot estático: editor navegável com o fonte do próprio editor embutido
      - name: Snapshot static site
        run: bash scripts/static-snapshot.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

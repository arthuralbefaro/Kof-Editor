name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # kof CLI p/ combine + check
      - name: Install kof
        if: matrix.target != 'windows-x86_64'
        run: |
          curl -L https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-linux-x86_64/kof-0.2.5-beta-linux-x86_64.tar.gz -o kof.tar.gz
          KOFDIR=$(tar tzf kof.tar.gz | head -1 | cut -d/ -f1)
          tar xzf kof.tar.gz
          echo "$PWD/$KOFDIR/bin" >> "$GITHUB_PATH"

      - name: Install kof (windows)
        if: matrix.target == 'windows-x86_64'
        shell: bash
        run: |
          curl -L https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-windows-x86_64/kof-0.2.5-beta-windows-x86_64.zip -o kof.zip
          powershell -Command "Expand-Archive -Force kof.zip kofdist"
          KOFDIR=$(ls -d kof-distro*/ 2>/dev/null | head -1 || true)
          if [ -z "$KOFDIR" ]; then KOFDIR=$(find . -maxdepth 1 -type d ! -name '.' ! -name 'kof*' ! -name 'editor' | head -1); fi
          ls -la
          echo "$PWD/$KOFDIR/bin" >> "$GITHUB_PATH" || echo "$PWD/kof-*/bin" >> "$GITHUB_PATH"

      - name: Package (instalador)
        shell: bash
        run: bash scripts/package-editor.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kof-editor-${{ matrix.target }}
          path: |
            dist/kof-editor-install-*.tar.gz
            dist/kof-editor-install-*.zip
            dist/SHA256SUMS

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare assets
        run: |
          mkdir -p assets
          find . -path '*/dist/*' \( -name 'kof-editor-install-*.tar.gz' -o -name 'kof-editor-install-*.zip' \) -exec cp {} assets/ \;
          # merge dos SHA256SUMS por plataforma
          find . -name SHA256SUMS -path '*/dist/*' -exec cat {} \; > assets/SHA256SUMS || true
          ls -la assets/

      - name: Release (tag fixa, atualizada a cada push)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kof-editor-0.1.0-beta
          name: Kof Editor 0.1.0-beta
          body: |
            Instaladores do Kof Editor (0.1.0-beta).

            ## Instalar
            1. Baixe o pacote do seu SO (abaixo)
            2. Extraia
            3. Rode `install.sh` (linux/macos) ou `install.bat` (windows)

            O instalador baixa o runtime Kof (com JDK embutido) na primeira
            execução e cria o launcher `kof-editor`. Depois:
            ```
            kof-editor
            # abra http://localhost:8765
            ```
          files: assets/*
          draft: false
          prerelease: true

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        name: Bump patch por push
        run: |
          git config user.name "kof-bumper"
          git config user.email "bumper@koflang.dev"
          V=$(cat VERSION)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # bump patch do sufixo -beta: 0.1.5-beta -> 0.1.6-beta
          BASE="${V%-beta}"; PATCH="${BASE##*.}"
          NV="${BASE%.*}.$((PATCH + 1))-beta"
          echo "$NV" > /dev/null
          echo "$NV" > VERSION
          echo "version=$NV" >> "$GITHUB_OUTPUT"
          if git diff --quiet VERSION; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            git add VERSION
            git commit -m "bump: versão $NV [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$NV" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (${{ matrix.target }})
    needs: bump
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout bumped version
        run: git pull --ff-only origin main

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # tudo num step só: instala kof, empacota e sobe o artifact
      - name: Package
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            KOF_URL="https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-windows-x86_64/kof-0.2.5-beta-windows-x86_64.zip"
          else
            KOF_URL="https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-linux-x86_64/kof-0.2.5-beta-linux-x86_64.tar.gz"
          fi
          case "${{ matrix.target }}" in
            macos-*) JURL="https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-macos-arm64/kof-0.2.5-beta-macos-arm64.tar.gz" ;;
            *)       JURL="$KOF_URL" ;;
          esac
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            curl -sL "$JURL" -o kof.zip
            powershell -Command "Expand-Archive -Force kof.zip kofdist"
            KOFDIR=$(find kofdist -maxdepth 1 -type d | tail -1)
          else
            curl -sL "$JURL" -o kof.tar.gz
            case "${{ matrix.target }}" in
              macos-*) KOFDIR="kof-0.2.5-beta-macos-arm64" ;;
              *)       KOFDIR="kof-0.2.5-beta-linux-x86_64" ;;
            esac
            tar xzf kof.tar.gz
          fi
          echo "$PWD/$KOFDIR/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/$KOFDIR/bin:$PATH"
          KOF_JAR="$PWD/$KOFDIR/lib/kof.jar" bash scripts/package-editor.sh
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kof-editor-${{ matrix.target }}
          path: |
            dist/kof-editor-*.tar.gz
            dist/kof-editor-*.zip
            dist/SHA256SUMS

  release:
    name: Publish release
    needs: [bump, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare assets
        run: |
          mkdir -p assets
          find . -path '*/dist/*' \( -name 'kof-editor-*.tar.gz' -o -name 'kof-editor-*.zip' \) ! -name '*install*' -exec cp {} assets/ \;
          # merge dos SHA256SUMS por plataforma
          find . -name SHA256SUMS -path '*/dist/*' -exec cat {} \; > assets/SHA256SUMS || true
          ls -la assets/

      - name: Release (tag fixa, atualizada a cada push)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kof-editor-${{ needs.bump.outputs.version }}
          name: Kof Editor ${{ needs.bump.outputs.version }}
          body: |
            Kof Editor 0.1.0-beta — executável por SO.

            ## Instalar
            1. Baixe o pacote do seu SO (abaixo)
            2. Extraia
            3. Rode `install.sh` (linux/macos) ou `install.bat` (windows)

            O pacote contém `kof-editor.jar` (runtime Kof + editor embutido).
            O instalador só baixa a distro com JDK se o sistema não tiver
            Java 21+. Depois:
            ```
            kof-editor
            # janela nativa ou http://localhost:8765
            ```
          files: assets/*
          draft: false
          prerelease: true

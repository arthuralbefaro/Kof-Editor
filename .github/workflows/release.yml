name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # tudo num step só: instala kof, empacota e sobe o artifact
      - name: Package
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            KOF_URL="https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-windows-x86_64/kof-0.2.5-beta-windows-x86_64.zip"
          else
            KOF_URL="https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-linux-x86_64/kof-0.2.5-beta-linux-x86_64.tar.gz"
          fi
          case "${{ matrix.target }}" in
            macos-*) JURL="https://github.com/KofLang/Kof4j/releases/download/kof-0.2.6-beta-macos-arm64/kof-0.2.5-beta-macos-arm64.tar.gz" ;;
            *)       JURL="$KOF_URL" ;;
          esac
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            curl -sL "$JURL" -o kof.zip
            powershell -Command "Expand-Archive -Force kof.zip kofdist"
            KOFDIR=$(find kofdist -maxdepth 1 -type d | tail -1)
          else
            curl -sL "$JURL" -o kof.tar.gz
            case "${{ matrix.target }}" in
              macos-*) KOFDIR="kof-0.2.5-beta-macos-arm64" ;;
              *)       KOFDIR="kof-0.2.5-beta-linux-x86_64" ;;
            esac
            tar xzf kof.tar.gz
          fi
          echo "$PWD/$KOFDIR/bin" >> "$GITHUB_PATH"
          export PATH="$PWD/$KOFDIR/bin:$PATH"
          KOF_JAR="$PWD/$KOFDIR/lib/kof.jar" bash scripts/package-editor.sh
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kof-editor-${{ matrix.target }}
          path: |
            dist/kof-editor-0.1.0-beta-*.tar.gz
            dist/kof-editor-0.1.0-beta-*.zip
            dist/SHA256SUMS

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare assets
        run: |
          mkdir -p assets
          find . -path '*/dist/*' \( -name 'kof-editor-0.1.0-beta-*.tar.gz' -o -name 'kof-editor-0.1.0-beta-*.zip' \) -exec cp {} assets/ \;
          # merge dos SHA256SUMS por plataforma
          find . -name SHA256SUMS -path '*/dist/*' -exec cat {} \; > assets/SHA256SUMS || true
          ls -la assets/

      - name: Release (tag fixa, atualizada a cada push)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kof-editor-0.1.0-beta
          name: Kof Editor 0.1.0-beta
          body: |
            Kof Editor 0.1.0-beta — executável por SO.

            ## Instalar
            1. Baixe o pacote do seu SO (abaixo)
            2. Extraia
            3. Rode `install.sh` (linux/macos) ou `install.bat` (windows)

            O pacote contém `kof-editor.jar` (runtime Kof + editor embutido).
            O instalador só baixa a distro com JDK se o sistema não tiver
            Java 21+. Depois:
            ```
            kof-editor
            # janela nativa ou http://localhost:8765
            ```
          files: assets/*
          draft: false
          prerelease: true
